global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+).*'
        target_label: service
        replacement: '$1'

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: gateway-graphql
    static_configs:
      - targets: ["host.docker.internal:4000"]
        labels:
          service: gateway-graphql
    metrics_path: /metrics

  - job_name: patient-service
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          service: patient-service
    metrics_path: /metrics

  - job_name: telemetry-ingest
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: telemetry-ingest
    metrics_path: /metrics

  - job_name: workflow-alerts
    static_configs:
      - targets: ["host.docker.internal:3001"]
        labels:
          service: workflow-alerts
    metrics_path: /metrics

  - job_name: risk-engine
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels:
          service: risk-engine
    metrics_path: /metrics

  - job_name: fhir-gateway
    static_configs:
      - targets: ["host.docker.internal:8002"]
        labels:
          service: fhir-gateway
    metrics_path: /metrics

  - job_name: billing-service
    static_configs:
      - targets: ["host.docker.internal:3002"]
        labels:
          service: billing-service
    metrics_path: /metrics

  # ── Blackbox synthetic probes — /health endpoint for every service ────────────
  # probe_success == 0 means the service is down or /health returned non-200.
  # Prometheus fires ServiceHealthProbeDown within one scrape interval (30s).
  - job_name: blackbox-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:4000/health   # gateway-graphql
          - http://host.docker.internal:3000/health   # patient-service
          - http://host.docker.internal:3001/health   # workflow-alerts
          - http://host.docker.internal:3002/health   # billing-service
          - http://host.docker.internal:8080/health   # telemetry-ingest
          - http://host.docker.internal:8001/health   # risk-engine
          - http://host.docker.internal:8002/health   # fhir-gateway
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
      - source_labels: [__param_target]
        regex: 'http://[^:]+:\d+/health'
        target_label: service
        replacement: '$1'
      - source_labels: [instance]
        regex: 'http://[^:]+:(\d+)/.*'
        target_label: port
        replacement: '$1'
