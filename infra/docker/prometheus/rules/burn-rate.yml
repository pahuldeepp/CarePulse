  - name: slo-burn-rate-workflow-alerts
    interval: 30s
    rules:
      - alert: WorkflowAlertsCreationFastBurn
        expr: |
          (
            sum(rate(alerts_created_total{service="workflow-alerts",status!="ok"}[1h]))
            /
            sum(rate(alerts_created_total{service="workflow-alerts"}[1h]))
          ) > (14.4 * (1 - 0.9995))
        for: 2m
        labels: { severity: page, slo: workflow-alerts.alert_creation_availability }
        annotations:
          summary: workflow-alerts creation burning 14.4x over 1h — missed alerts likely

      - alert: WorkflowAlertsProjectionLagPage
        expr: |
          max(kafka_consumer_records_lag_max{service="workflow-alerts",topic="cdc.outbox.events",group="alert-projector"}) > 100
        for: 5m
        labels: { severity: page, slo: workflow-alerts.dynamo_projection_lag }
        annotations:
          summary: alert-projector consumer lag > 100 for 5m — NEWS2 escalation Lambda will fire late
          runbook: https://github.com/pahuldeepp/CarePulse/blob/main/docs/runbooks/kafka-consumer-lag.md

  - name: slo-burn-rate-risk-engine
