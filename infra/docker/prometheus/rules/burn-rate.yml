        for: 15m
        labels: { severity: ticket, slo: billing-service.availability }

      - alert: BillingStripeWebhookFastBurn
        expr: |
          (
            sum(rate(stripe_webhook_processed_total{service="billing-service",status!="ok"}[1h]))
            /
            sum(rate(stripe_webhook_processed_total{service="billing-service"}[1h]))
          ) > (14.4 * (1 - 0.999))
        for: 2m
        labels: { severity: page, slo: billing-service.stripe_webhook_processing }
        annotations:
          summary: Stripe webhook failures > budget — subscription state diverging from Stripe
