  - name: slo-burn-rate-telemetry-ingest
    interval: 30s
    rules:
      - alert: TelemetryIngestAvailabilityFastBurn
        expr: |
          (
            sum(rate(http_requests_total{service="telemetry-ingest",code=~"5.."}[1h]))
            /
            sum(rate(http_requests_total{service="telemetry-ingest"}[1h]))
          ) > (14.4 * (1 - 0.9995))
        for: 2m
        labels: { severity: page, slo: telemetry-ingest.availability }
        annotations:
          summary: telemetry-ingest burning error budget 14.4x over 1h

      - alert: TelemetryIngestAvailabilitySlowBurn
        expr: |
          (
            sum(rate(http_requests_total{service="telemetry-ingest",code=~"5.."}[6h]))
            /
            sum(rate(http_requests_total{service="telemetry-ingest"}[6h]))
