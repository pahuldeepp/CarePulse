service: patient-service
owner: clinical-data
slos:
  - name: availability
    sli:
      type: availability
      good_query: sum(rate(http_requests_total{service="patient-service",code!~"5.."}[5m]))
      total_query: sum(rate(http_requests_total{service="patient-service"}[5m]))
    objective: 99.9
    window: 30d
    burn_rate_alerts:
      - severity: page
        long_window: 1h
        burn_rate: 14.4
      - severity: ticket
        long_window: 6h
        burn_rate: 6

  - name: outbox_publish_lag
    sli:
      type: latency
      good_query: sum(rate(outbox_publish_duration_seconds_bucket{service="patient-service",le="2"}[5m]))
      total_query: sum(rate(outbox_publish_duration_seconds_count{service="patient-service"}[5m]))
    objective: 99.0
    window: 30d
    burn_rate_alerts:
      - severity: ticket
        long_window: 6h
        burn_rate: 6
