service: workflow-alerts
owner: clinical-ops
slos:
  - name: alert_creation_availability
    sli:
      type: availability
      good_query: sum(rate(alerts_created_total{service="workflow-alerts",status="ok"}[5m]))
      total_query: sum(rate(alerts_created_total{service="workflow-alerts"}[5m]))
    objective: 99.95
    window: 30d
    burn_rate_alerts:
      - severity: page
        long_window: 1h
        burn_rate: 14.4
      - severity: ticket
        long_window: 6h
        burn_rate: 6

  - name: ack_latency
    sli:
      type: latency
      good_query: sum(rate(alert_ack_duration_seconds_bucket{service="workflow-alerts",le="0.5"}[5m]))
      total_query: sum(rate(alert_ack_duration_seconds_count{service="workflow-alerts"}[5m]))
    objective: 99.0
    window: 30d
    burn_rate_alerts:
      - severity: ticket
        long_window: 6h
        burn_rate: 6
    notes: |
      Time from clinician POST /alerts/:id/ack to both Postgres and the
      escalation projection (today: DynamoDB) reflecting acknowledged_at.
      Matters because check_handler Lambda reads acknowledged_at to decide
      whether to fire the 15-min escalation — a stale read means a nurse
      who already acked gets paged again, or worse, escalation suppression
      lingers after a failed ack.

  - name: dynamo_projection_lag
    sli:
      type: latency
      good_query: |
        sum(rate(kafka_consumer_records_lag_max{service="workflow-alerts",topic="cdc.outbox.events",group="alert-projector"}[5m])) <= bool 100
      total_query: vector(1)
    objective: 99.9
    window: 30d
    burn_rate_alerts:
      - severity: page
        long_window: 1h
        burn_rate: 14.4
    notes: |
      Measured as consumer lag on the alert-projector group (post-S9-08).
      Lag ≤100 messages is "good"; sustained breach indicates the projector
      can't keep up and the escalation Lambda will fire late or not at all
      within the NHS NEWS2 15-min window. See ADR-0005.
